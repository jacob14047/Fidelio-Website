# --- DATABASE DI TEST (H2 In-Memory) ---
# Questo crea un database temporaneo nella RAM che si distrugge alla fine del test.
# NON si connette al tuo Aiven Cloud.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ricrea le tabelle pulite ad ogni avvio dei test
spring.jpa.hibernate.ddl-auto=create-drop

# --- CONFIGURAZIONE TMDB (Fake o Reale) ---
# Spring ha bisogno di questi valori per avviarsi, anche se poi li mockeremo.
# Puoi lasciare i valori reali o metterne di finti, tanto Mockito intercetterà le chiamate.
tmdb.base-url=https://api.themoviedb.org/3
tmdb.api-key=8e046a1f889448120a3f4ca582d130c5
tmdb.language=en-US
tmdb.region=US
tmdb.poster-base=https://image.tmdb.org/t/p/w500

# --- ALTRE CONFIGURAZIONI UTILI PER I TEST ---
# Disabilita la cache di Thymeleaf nei test per vedere subito le modifiche se testi i template
spring.thymeleaf.cache=false
# Livello di log per vedere le query SQL fatte dai test (opzionale, utile per debug)
logging.level.org.hibernate.SQL=DEBUG